# 设备无关回归：每个 PR 和 main 的每次推送都跑。不用手机，不打包，只跑 tests/。
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 准备 adb（run.py 在 import 时就要求找得到 adb，测试本身不用手机）
        run: |
          adb="$(command -v adb || true)"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          if [ -z "$adb" ] && [ -x "$sdk" ]; then adb="$sdk"; fi
          if [ -z "$adb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y adb
            adb="$(command -v adb)"
          fi
          echo "ADB=$adb" >> "$GITHUB_ENV"
          "$adb" version
      - name: 静态检查（未定义名 / 未使用导入；recipes/ 靠注入作用域执行，查不了）
        run: |
          pip install ruff==0.17.3
          ruff check --select F,E9 tool tests gui
      - name: 设备无关回归测试
        run: python -m unittest discover -s tests -v
