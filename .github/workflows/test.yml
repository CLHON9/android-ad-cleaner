# 设备无关回归：每个 PR 和 main 的每次推送都跑。不用手机，不打包，只跑 tests/。
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 设备无关回归测试
        run: python -m unittest discover -s tests -v
